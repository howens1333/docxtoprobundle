name: Build Mac App
on:
  push:
    branches: [main, 'desktop/**']
    paths: ['index.html', 'desktop/**', 'package.json', 'package-lock.json', '.github/workflows/desktop-macos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run desktop:prepare
      - run: npm run desktop:verify
      - run: npm run desktop:build -- universal
      - uses: actions/upload-artifact@v4
        with:
          name: Sermon-Converter-Mac
          path: dist/Sermon-Converter-Mac.zip
          if-no-files-found: error
          retention-days: 30
